[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-evidence-qa"
version = "0.2.0"
description = "Data-independent core for BIM evidence question answering"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell==0.8.5",
    "PyMuPDF==1.28.2",
    "streamlit==1.62.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
